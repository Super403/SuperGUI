;===========================================================================
; 快速启动工具配置文件
; 运行环境：Python 3.10 (Python 3.7可能存在兼容性问题)
; UI主题参考：https://ttkbootstrap.readthedocs.io/en/latest/zh/

; 配置文件结构说明：
; 1. [app] 部分：全局配置
; 2. [tool] 部分：工具区域配置
; 3. [note] 部分：笔记区域配置
;===========================================================================

[app]
; 应用程序标题
title = SuperGui -V2.0.1-BY-Super403开发

; UI主题设置
; 可选主题：litera, darkly, lumen, sandstone, yeti, united, morph, 
;          journal, superhero, solar, simplex, cerculean
theme = cosmo

; 颜色主题
primary_color = #3498db    ; 主要颜色
secondary_color = #2ecc71  ; 次要颜色
accent_color = #e74c3c    ; 强调颜色
text_color = #2c3e50      ; 文本颜色
bg_color = #ecf0f1        ; 背景颜色

; 窗口尺寸设置（像素）
; 窗口宽度
size_w = 2400
; 窗口高度
size_h = 1200
;工具大小--高

average = 10
;工具等分为多少份
tool_aver = 6
;工具框架占比3份，说明，工具框架的宽度占比总宽的3/5
note_aver = 4
;工具框架占比3份，占比总宽的2/5


txt_mark=00.txt
;笔记标识，每个工具的txt备忘。不建议修改。00可以保证排序比较前。

;============================tool框架相关参数-左边====================================

[tool]
title=PS: 挖洞人专用
;工具框架的标题
theme=default
;Labelframe控件bootstyle，影响边框颜色参考：default,primary,success,info,warning,danger
scrolled=round
;滚动条样式：圆【加-round】和方形，方形参考：default,primary,secondary,success,info,warning,danger,light,dark，圆角举例：danger-round，默认圆角就是round

toolColumn=4
;多少列，工具框架中多少列，可修改
columnWidth=28
;列宽--自己设置，分辨率会影响，所以需要自己调试

;注意：这里的后面的标识也是目录识别的特征，可以自己设置，根据不同的标识区分不同类别，实现功能菜单的切换
;同步toolColumn参数，如果设置7列，列表中必须7个元素，如果分类不多，就用["预留X","自己设定标志识别符"]占位。
funList=[["工作日常","A-"],["信息收集","B-"],["渗透测试","C-"],["后渗透","D-"]]

funBtnBootstyle=dark
;工具框架中的菜单切换按钮的样式
typeBtnBootstyle=dark-outline
;工具类别按钮的样式
toolBtnBootstyle=dark-linkdanger-link
;工具按钮的样式


;==================================note框架相关参数-右边===============================

[note]
title=PS:笔记区域
;笔记框架的标题
theme=default
;笔记框架样式，Labelframe控件bootstyle，影响边框颜色参考：default,primary,success,info,warning,danger
theme_up = default
;笔记框架功能框架样式，Labelframe控件bootstyle，影响边框颜色参考：default,primary,success,info,warning,danger

funBtnBootstyle=dark-outline
;笔记框架中上面的按钮的样式，Bootstyle：default,primary,secondary,success,info,warning,danger,light,dark

startComBtnBootstyle_open=info
;启动命令修改按钮样式的单独设置，参考Bootstyle
startComBtnBootstyle_save=primary
;启动命令按钮样式的单独设置，参考Bootstyle

styleBtnBootstyle_open=info
;样式修改按钮样式的单独设置，参考Bootstyle
styleBtnBootstyle_save=danger
;样式保存按钮样式单独设置，参考Bootstyle

txt_title=--Content--
;txt笔记的文本提示信息，LabelFrame，后续会随点击的工具不同，变成对应的路径信息

noteFrameDownStyle=default
;笔记框架文本框架样式，Style  笔记框架中分上下，上-功能，下-txt笔记，
scrolledTextBootstyle=default-round
;txt笔记的滚动条样式，;滚动条样式：圆【加-round】和方形，方形参考：default,primary,secondary,success,info,warning,danger,light,dark，圆角举例：danger-round，默认圆角就是round






